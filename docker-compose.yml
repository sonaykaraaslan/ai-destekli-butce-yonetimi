services:
  backend:
    build:
      context: ./backend
    container_name: ailefinans-backend
    volumes:
      - backend-data:/app/database
      - backend-uploads:/app/uploads
    environment:
      CORS_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 90s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: ailefinans-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
  backend-uploads:
